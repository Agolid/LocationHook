name: locationhook
description: Location tracking application with geofence and background service support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.7
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
